<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" role="img" aria-label="Didaktické funkční schéma jističe"><title>Didaktické funkční schéma jističe</title><defs><linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5fcfd"/><stop offset="1" stop-color="#fff"/></linearGradient><pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#d8e8e9" stroke-width="1"/></pattern><style>text{font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif;fill:#163e43}.head{font-size:31px;font-weight:780}.sub{font-size:17px;fill:#55777b}.label{font-size:19px;font-weight:700}.small{font-size:16px;fill:#45686d}.tiny{font-size:14px;fill:#5b7578}.axis{stroke:#35565d;stroke-width:3;stroke-linecap:round}.orange{stroke:#d76e3a;fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.teal{stroke:#079b9e;fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}.dashed{stroke-dasharray:7 7}</style></defs><rect width="960" height="580" rx="22" fill="url(#panel)"/><text x="52" y="61" class="head">Princip jističe · funkční schéma</text><text x="52" y="95" class="sub">Jak dvě spouště uvolní stejný vypínací mechanismus</text><rect x="48" y="137" width="864" height="343" rx="20" fill="#f2fafa" stroke="#c8e5e6" stroke-width="2"/>
<rect x="78" y="173" width="240" height="100" rx="17" fill="#fff0e7" stroke="#d58b66" stroke-width="2"/><text x="198" y="205" text-anchor="middle" class="label">3 · Tepelná spoušť</text><text x="198" y="236" text-anchor="middle" class="small">Bimetal</text><text x="198" y="259" text-anchor="middle" class="tiny">přetížení</text>
<rect x="78" y="318" width="240" height="100" rx="17" fill="#e7f4fc" stroke="#7da8c8" stroke-width="2"/><text x="198" y="350" text-anchor="middle" class="label">4 · Zkratová spoušť</text><text x="198" y="380" text-anchor="middle" class="small">Elektromagnet</text><text x="198" y="404" text-anchor="middle" class="tiny">velký zkratový proud</text>
<path d="M320 224H382V294H430M320 368H382V294H430" fill="none" stroke="#079b9e" stroke-width="4" stroke-linecap="round"/><path d="M421 285l13 9-13 9" fill="none" stroke="#079b9e" stroke-width="3"/>
<rect x="431" y="242" width="201" height="108" rx="17" fill="#ffffff" stroke="#84babc" stroke-width="2"/><text x="531" y="277" text-anchor="middle" class="label">7 · Západka</text><text x="531" y="307" text-anchor="middle" class="small">uvolní</text><text x="531" y="333" text-anchor="middle" class="small">mechanismus</text>
<path d="M632 294H680" stroke="#079b9e" stroke-width="4"/><path d="M672 285l13 9-13 9" fill="none" stroke="#079b9e" stroke-width="3"/>
<rect x="686" y="242" width="198" height="108" rx="17" fill="#e8f8ef" stroke="#8bc1a4" stroke-width="2"/><text x="785" y="277" text-anchor="middle" class="label">6 · Pružina</text><text x="785" y="307" text-anchor="middle" class="small">rozpojí</text><text x="785" y="333" text-anchor="middle" class="small">1 + 2 · kontakty</text>
<rect x="434" y="389" width="449" height="63" rx="14" fill="#e6f4f5"/><text x="659" y="415" class="label" text-anchor="middle">8 · Zhášecí komora</text><text x="659" y="440" class="small" text-anchor="middle">pomáhá uhasit elektrický oblouk</text>
<path d="M784 350v37" stroke="#079b9e" stroke-width="3" stroke-dasharray="6 5"/><text x="50" y="524" class="small">1 – pevný kontakt   ·   2 – pohyblivý kontakt   ·   5 – pohyblivé jádro elektromagnetu</text><text x="50" y="551" class="tiny">Didaktické funkční schéma, nikoli konstrukční nebo zapojovací výkres.</text></svg>