<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 310" role="img" aria-labelledby="rr4title rr4desc"><title id="rr4title">Princip skupinového přepínače řazení 4</title><desc id="rr4desc">Tři možné polohy: vypnuto, zapnuta větev A, zapnuta větev B. Obě větve nejsou současně spojeny.</desc><rect x="5" y="5" width="750" height="300" rx="22" fill="#f7fbfa" stroke="#cadeda"/><g font-family="Arial,sans-serif" fill="#195e63" text-anchor="middle"><text x="125" y="41" font-size="19" font-weight="700">0 · vypnuto</text><text x="380" y="41" font-size="19" font-weight="700">I · větev A</text><text x="630" y="41" font-size="19" font-weight="700">II · větev B</text></g><g stroke="#3a6973" stroke-width="5" stroke-linecap="round" fill="none"><path d="M45 168H105 M145 120H197 M145 210H197 M300 168H358 M400 120H452 M400 210H452 M550 168H608 M650 120H702 M650 210H702"/></g><g fill="#fff" stroke="#3a6973" stroke-width="3"><circle cx="105" cy="168" r="8"/><circle cx="145" cy="120" r="8"/><circle cx="145" cy="210" r="8"/><circle cx="358" cy="168" r="8"/><circle cx="400" cy="120" r="8"/><circle cx="400" cy="210" r="8"/><circle cx="608" cy="168" r="8"/><circle cx="650" cy="120" r="8"/><circle cx="650" cy="210" r="8"/></g><path d="M358 168L400 120" stroke="#0d9488" stroke-width="7" stroke-linecap="round"/><path d="M608 168L650 210" stroke="#d97706" stroke-width="7" stroke-linecap="round"/><path d="M105 168L136 163" stroke="#3a6973" stroke-width="5" stroke-linecap="round"/><g font-family="Arial,sans-serif" font-size="15" fill="#55767b" text-anchor="middle"><text x="105" y="266">A vypnuta · B vypnuta</text><text x="380" y="266">Svítí pouze A</text><text x="630" y="266">Svítí pouze B</text></g></svg>